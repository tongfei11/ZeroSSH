<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zero SSH · 主机与会话</title>
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/style.css">
  <script src="/vendor/xterm.js" defer></script>
  <script src="/vendor/xterm-fit.js" defer></script>
  <script src="/app.js" defer></script>
  <script src="/i18n.js" defer></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/"><span class="mark">&gt;_</span><span>Zero<span class="accent">SSH</span><small>CARDPUTER ZERO</small></span></a>
    <span class="build">DEMO <span id="version">0007</span></span>
  </header>
  <main>
    <dialog id="access-dialog">
      <form id="access-form">
        <h2>Zero SSH</h2>
        <label>设备访问码 / Device access code<input id="access-code" inputmode="numeric" autocomplete="off" required></label>
        <p id="access-error" role="alert"></p>
        <button class="primary" type="submit">登录 / Sign in</button>
      </form>
    </dialog>
    <div class="intro"><h1>主机与会话</h1><button id="add" class="primary">＋ 添加主机</button></div>
    <div class="workspace">
      <aside class="hosts" aria-labelledby="hosts-heading">
        <div class="pane-heading"><h2 id="hosts-heading">主机</h2><span class="count" id="host-count">0</span></div>
        <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索主机或地址" aria-label="搜索主机或地址"></label>
        <div id="host-list"></div>
      </aside>
      <section class="console" aria-labelledby="console-heading">
        <div class="pane-heading"><h2 id="console-heading">终端会话</h2><span id="connection" class="connection">未连接</span></div>
        <div id="tabs" class="tabs" aria-label="会话"></div>
        <form id="ssh-auth" hidden>
          <label for="ssh-secret" id="ssh-secret-label">SSH 登录密码</label>
          <input id="ssh-secret" type="password" autocomplete="off" required>
          <button class="primary" type="submit">登录</button>
        </form>
        <div class="terminal-wrap">
          <div id="terminal"></div>
          <div id="empty"><div class="mark large">&gt;_</div><h3>打开一个会话</h3><p>从左侧选择主机。切换会话时，后台继续运行。</p><button id="try-demo" class="primary">打开演示终端</button></div>
        </div>
        <div class="console-foot"><span id="session-type">SSH</span><span id="session-total">0 个会话</span></div>
      </section>
    </div>
    <p id="notice" role="status"></p>
  </main>
  <dialog id="host-dialog">
    <form id="host-form">
      <h2 id="form-title">添加主机</h2>
      <label>名称<input name="name" maxlength="80" placeholder="留空使用主机地址"></label>
      <div class="form-row"><label>主机地址<input name="hostname" maxlength="253" required placeholder="192.168.1.10"></label><label>端口<input type="number" name="port" min="1" max="65535" value="22" required></label></div>
      <label>用户名<input name="user" maxlength="64" required placeholder="例如 admin"></label>
      <fieldset class="credentials">
        <legend>SSH 登录方式</legend>
        <div class="credential-options">
          <label><input type="radio" name="authMode" value="password" checked>密码</label>
          <label><input type="radio" name="authMode" value="key">私钥</label>
        </div>
        <div id="password-fields">
          <label for="host-password">SSH 登录密码</label>
          <input id="host-password" type="password" maxlength="1023" autocomplete="new-password" aria-describedby="host-password-help">
          <p id="host-password-help">填写后保存到 Zero SSH，下次连接自动使用。</p>
          <label class="remove-key" id="remove-password-row" hidden><input id="remove-password" type="checkbox">清除已保存的密码</label>
        </div>
        <div id="key-fields" hidden>
          <label for="key-file">导入私钥文件</label>
          <input id="key-file" type="file" aria-describedby="key-help">
          <p id="key-help">支持 OpenSSH 和 PEM 私钥文件。</p>
        </div>
        <label class="remove-key" id="remove-key-row" hidden><input id="remove-key" type="checkbox">移除已导入的私钥</label>
      </fieldset>
      <p id="form-error" role="alert"></p>
      <div class="form-actions"><button type="button" id="delete-host" class="danger">删除主机</button><div><button type="button" id="cancel">取消</button><button type="submit" class="primary" id="save-host">保存主机</button></div></div>
    </form>
  </dialog>
</body>
</html>
